<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:339px;overflow:hidden;}
  .card{position:relative;width:1080px;height:339px;background:#F4EFE2;overflow:hidden;}

  /* 山形：按原图轮廓量得，每侧两座，左右镜像 */
  .mt{position:absolute;bottom:0;width:0;height:0;border-style:solid;
      border-color:transparent transparent #E7D9BA transparent;}
  .a {left:-76px;  border-width:0 169px 113px 169px;}
  .b {left:80px;   border-width:0 120px  71px 120px;}
  .a2{right:-76px; border-width:0 169px 113px 169px;}
  .b2{right:80px;  border-width:0 120px  71px 120px;}

  .head{position:absolute;left:0;right:0;top:54px;
        display:flex;align-items:center;justify-content:center;gap:30px;}
  .lockup{height:37px;width:146px;flex:none;align-self:center;object-fit:contain;}
  .bar{width:2px;height:28px;background:#C9BCA4;flex:none;}
  .zh{font-family:'PingFang SC','Microsoft YaHei',sans-serif;
      font-size:32px;font-weight:500;color:#33444C;letter-spacing:.2em;
      white-space:nowrap;padding-left:.2em;}

  .lead{position:absolute;left:0;right:0;top:151px;text-align:center;
        font-family:'PingFang SC','Microsoft YaHei',sans-serif;
        font-size:41px;font-weight:600;color:#33444C;letter-spacing:.005em;}
  .sub{position:absolute;left:0;right:0;top:222px;text-align:center;
       font-family:'PingFang SC','Microsoft YaHei',sans-serif;
       font-size:24px;font-weight:400;color:#6B6558;letter-spacing:.02em;}
</style>
<div class="card">
  <i class="mt a"></i><i class="mt b"></i><i class="mt a2"></i><i class="mt b2"></i>
  <div class="head">
    <img class="lockup" src="light690x175nobg.png" alt="">
    <i class="bar"></i>
    <div class="zh">共识之中</div>
  </div>
  <div class="lead">全球市场观察</div>
  <div class="sub">美股、加密资产、半导体与宏观</div>
</div>
